<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Khmer:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#fcfbfe; --surface:#f4f1fb; --surface-2:#ebe7f5;
      --line:rgba(20,16,30,.12); --line-strong:rgba(20,16,30,.28);
      --ink:#16141c; --ink-dim:#5b5766; --ink-faint:#8b8796;
      --accent:#15803d; --accent-soft:#106430; --accent-ink:#ffffff;
      --accent-wash:rgba(16,100,48,.10); --accent-edge:rgba(16,100,48,.25);
      --font-display:"Newsreader",Georgia,serif;
      --font-text:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
      --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
      --font-khmer:"Noto Sans Khmer",sans-serif;
      --r-card:1.25rem; --r-control:1rem; --r-pill:999px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-text);font-size:16px;line-height:1.6}
    a{color:var(--accent-soft);text-decoration:none} a:hover{color:var(--accent)}
    .km{font-family:var(--font-khmer);line-height:1.5}
    .lbl{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
         color:var(--ink-faint);margin:0 0 11px}
  </style>
</helmet>

<div style="width:390px;min-height:844px;display:flex;flex-direction:column;background:var(--surface)">

  <div style="background:var(--bg);padding:16px 20px;border-bottom:1px solid var(--line)">
    <p style="margin:0;font-family:var(--font-display);font-size:1.12rem;font-weight:600">History</p>
    <p style="margin:0;font-size:.79rem;color:var(--ink-faint)">counter.heartbank.ceo</p>
  </div>

  <div style="background:var(--bg);padding:12px 20px;border-bottom:1px solid var(--line);display:flex;gap:20px">
    <span style="font-size:.9rem;font-weight:600;color:var(--accent-soft);
                 border-bottom:2px solid var(--accent);padding-bottom:9px">Today</span>
    <span style="font-size:.9rem;color:var(--ink-dim);padding-bottom:9px">This week</span>
  </div>

  <div style="padding:18px 16px 0;display:flex;flex-direction:column;gap:12px">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px">
        <span style="font-family:var(--font-display);font-size:1.1rem;font-weight:600">Thon</span>
        <span style="font-family:var(--font-mono);font-size:.74rem;color:var(--ink-faint)">3:52</span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:11px"><div style="width:30px;height:30px;border-radius:.7rem;overflow:hidden;flex:none"><svg viewBox="0 0 48 48" style="width:100%;height:100%;display:block"><rect width="48" height="48" fill="#e9dcc6"/><path d="M15 12h18l-2.4 26h-13.2z" fill="#4a2c17"/><path d="M15 12h18l-.9 10h-16.2z" fill="#cfa87a"/><rect x="14" y="9.5" width="20" height="3.5" rx="1.7" fill="#f2e6d4"/></svg></div><div style="width:30px;height:30px;border-radius:.7rem;overflow:hidden;flex:none"><svg viewBox="0 0 48 48" style="width:100%;height:100%;display:block"><rect width="48" height="48" fill="#f6ead2"/><path d="M24 6 L41 38 H7 Z" fill="#e8b657"/><path d="M24 11 L37 36 H11 Z" fill="#dd8a3c"/><path d="M7 38 h34 l1.5 4 H5.5 Z" fill="#c07a3a"/><circle cx="24" cy="22" r="3.2" fill="#c0392b"/></svg></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <span style="font-family:var(--font-mono);font-size:.72rem;border-radius:var(--r-pill);padding:3px 10px;background:var(--accent-wash);color:var(--accent-soft)">settled</span>
        <span style="font-family:var(--font-mono);font-size:.9rem;font-weight:500">7,500៛</span>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px">
        <span style="font-family:var(--font-display);font-size:1.1rem;font-weight:600">Sokha</span>
        <span style="font-family:var(--font-mono);font-size:.74rem;color:var(--ink-faint)">3:47</span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:11px"><div style="width:30px;height:30px;border-radius:.7rem;overflow:hidden;flex:none"><svg viewBox="0 0 48 48" style="width:100%;height:100%;display:block"><rect width="48" height="48" fill="#f0e6d4"/><path d="M15 12h18l-2.4 26h-13.2z" fill="#8a6038"/><path d="M15 12h18l-1.2 13h-15.6z" fill="#efe0c8"/><rect x="14" y="9.5" width="20" height="3.5" rx="1.7" fill="#f7efe2"/></svg></div><div style="width:30px;height:30px;border-radius:.7rem;overflow:hidden;flex:none"><svg viewBox="0 0 48 48" style="width:100%;height:100%;display:block"><rect width="48" height="48" fill="#f0e6d4"/><path d="M15 12h18l-2.4 26h-13.2z" fill="#8a6038"/><path d="M15 12h18l-1.2 13h-15.6z" fill="#efe0c8"/><rect x="14" y="9.5" width="20" height="3.5" rx="1.7" fill="#f7efe2"/></svg></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <span style="font-family:var(--font-mono);font-size:.72rem;border-radius:var(--r-pill);padding:3px 10px;background:var(--accent-wash);color:var(--accent-soft)">settled</span>
        <span style="font-family:var(--font-mono);font-size:.9rem;font-weight:500">7,000៛</span>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px">
        <span style="font-family:var(--font-display);font-size:1.1rem;font-weight:600">Dara</span>
        <span style="font-family:var(--font-mono);font-size:.74rem;color:var(--ink-faint)">3:31</span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:11px"><div style="width:30px;height:30px;border-radius:.7rem;overflow:hidden;flex:none"><svg viewBox="0 0 48 48" style="width:100%;height:100%;display:block"><rect width="48" height="48" fill="#e9dcc6"/><path d="M15 12h18l-2.4 26h-13.2z" fill="#4a2c17"/><path d="M15 12h18l-.9 10h-16.2z" fill="#cfa87a"/><rect x="14" y="9.5" width="20" height="3.5" rx="1.7" fill="#f2e6d4"/></svg></div><div style="width:30px;height:30px;border-radius:.7rem;overflow:hidden;flex:none"><svg viewBox="0 0 48 48" style="width:100%;height:100%;display:block"><rect width="48" height="48" fill="#e9dcc6"/><path d="M15 12h18l-2.4 26h-13.2z" fill="#4a2c17"/><path d="M15 12h18l-.9 10h-16.2z" fill="#cfa87a"/><rect x="14" y="9.5" width="20" height="3.5" rx="1.7" fill="#f2e6d4"/></svg></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <span style="font-family:var(--font-mono);font-size:.72rem;border-radius:var(--r-pill);padding:3px 10px;background:var(--accent-wash);color:var(--accent-soft)">settled</span>
        <span style="font-family:var(--font-mono);font-size:.9rem;font-weight:500">7,000៛</span>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px">
        <span style="font-family:var(--font-display);font-size:1.1rem;font-weight:600">ស្រីមុំ</span>
        <span style="font-family:var(--font-mono);font-size:.74rem;color:var(--ink-faint)">3:12</span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:11px"><div style="width:30px;height:30px;border-radius:.7rem;overflow:hidden;flex:none"><svg viewBox="0 0 48 48" style="width:100%;height:100%;display:block"><rect width="48" height="48" fill="#f0e6d4"/><path d="M15 12h18l-2.4 26h-13.2z" fill="#8a6038"/><path d="M15 12h18l-1.2 13h-15.6z" fill="#efe0c8"/><rect x="14" y="9.5" width="20" height="3.5" rx="1.7" fill="#f7efe2"/></svg></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <span style="font-family:var(--font-mono);font-size:.72rem;border-radius:var(--r-pill);padding:3px 10px;background:var(--surface-2);color:var(--ink-dim)">not settled</span>
        <span style="font-family:var(--font-mono);font-size:.9rem;font-weight:500">2,500៛</span>
      </div>
    </div>
  </div>

  <div style="padding:18px 16px 0">
    <div style="background:var(--bg);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px;
                display:flex;justify-content:space-between;align-items:baseline;gap:14px">
      <span style="font-size:.93rem;color:var(--ink-dim)">28 orders today</span>
      <span style="font-family:var(--font-mono);font-size:1.05rem;font-weight:500">96,500៛</span>
    </div>
    <p style="margin:11px 4px 0;font-size:.81rem;color:var(--ink-faint);line-height:1.55">
      One is still unsettled. It stays here until the money arrives — nothing chases anybody.
    </p>
  </div>
  <div style="margin-top:auto;position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);
              display:flex;justify-content:space-around;padding:11px 8px 18px">
    <div style="text-align:center;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px">
      <svg viewBox="0 0 24 24" width="21" height="21"><path fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span style="font-size:.7rem">Orders</span>
    </div>
    <div style="text-align:center;color:var(--accent);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px">
      <svg viewBox="0 0 24 24" width="21" height="21"><path fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round" d="M5 4h14v16l-7-3.5L5 20z"/></svg>
      <span style="font-size:.7rem;font-weight:500">History</span>
    </div>
    <div style="text-align:center;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;opacity:.35">
      <svg viewBox="0 0 24 24" width="21" height="21"><path fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round" d="M4 20V9l8-5 8 5v11a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
      <span style="font-size:.7rem">Shop</span>
    </div>
    <div style="text-align:center;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px">
      <svg viewBox="0 0 24 24" width="21" height="21"><circle cx="12" cy="8" r="3.4" fill="none"
        stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round" d="M5.5 19.5a6.8 6.8 0 0 1 13 0"/></svg>
      <span style="font-size:.7rem">You</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
