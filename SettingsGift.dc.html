<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Khmer:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#fcfbfe; --surface:#f4f1fb; --surface-2:#ebe7f5;
      --line:rgba(20,16,30,.12); --line-strong:rgba(20,16,30,.28);
      --ink:#16141c; --ink-dim:#5b5766; --ink-faint:#8b8796;
      --accent:#15803d; --accent-soft:#106430; --accent-ink:#ffffff;
      --accent-wash:rgba(16,100,48,.10); --accent-edge:rgba(16,100,48,.25);
      --font-display:"Newsreader",Georgia,serif;
      --font-text:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
      --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
      --font-khmer:"Noto Sans Khmer",sans-serif;
      --r-card:1.25rem; --r-control:1rem; --r-pill:999px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-text);font-size:16px;line-height:1.6}
    a{color:var(--accent-soft);text-decoration:none} a:hover{color:var(--accent)}
    .km{font-family:var(--font-khmer);line-height:1.5}
    .lbl{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
         color:var(--ink-faint);margin:0 0 11px}
    .card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 17px}
    .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0}
    .stepper{display:flex;align-items:center;gap:11px}
    .step{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-strong);background:var(--bg);
          display:flex;align-items:center;justify-content:center;font-size:1.1rem;line-height:1;cursor:pointer}
  </style>
</helmet>

<div style="width:390px;min-height:844px;display:flex;flex-direction:column;background:var(--surface)">

  <div style="background:var(--bg);padding:16px 20px;border-bottom:1px solid var(--line);
              display:flex;align-items:center;justify-content:space-between;gap:12px">
    <div style="display:flex;align-items:center;gap:13px;min-width:0">
      <span style="font-size:1.4rem;color:var(--ink-dim);cursor:pointer;line-height:1">←</span>
      <span style="font-family:var(--font-display);font-size:1.12rem;font-weight:600">Welcome gift</span>
    </div>
    <span style="font-family:var(--font-mono);font-size:.66rem;letter-spacing:.04em;
                 border:1px solid var(--accent-edge);color:var(--accent-soft);background:var(--accent-wash);
                 border-radius:var(--r-pill);padding:4px 10px;white-space:nowrap">KANGHNA · OWNER</span>
  </div>

  <div style="padding:18px 16px 0;display:flex;flex-direction:column;gap:18px">
    <!-- check-in: cap + cooldown, owner-set -->
    <div class="card">
      <p class="lbl">Welcome gift</p>
      <div class="row" style="padding-top:0">
        <div style="min-width:0">
          <p style="margin:0;font-size:.93rem;font-weight:500">Points for scanning at the counter</p>
          <p style="margin:1px 0 0;font-size:.81rem;color:var(--ink-dim)">Costs you what the reward costs</p>
        </div>
        <span style="width:46px;height:27px;border-radius:var(--r-pill);background:var(--accent);
                     position:relative;display:block;flex:none">
          <span style="position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff"></span>
        </span>
      </div>
      <div style="height:1px;background:var(--line);margin:6px 0"></div>
      <div class="row">
        <span style="font-size:.93rem">Points each time</span>
        <div class="stepper">
          <span class="step">−</span>
          <span style="font-family:var(--font-mono);font-size:1rem;font-weight:500;min-width:22px;text-align:center">5</span>
          <span class="step">+</span>
        </div>
      </div>
      <div class="row">
        <span style="font-size:.93rem">Times per person</span>
        <div class="stepper">
          <span class="step">−</span>
          <span style="font-family:var(--font-mono);font-size:1rem;font-weight:500;min-width:22px;text-align:center">1</span>
          <span class="step">+</span>
        </div>
      </div>
      <div class="row" style="padding-bottom:0">
        <span style="font-size:.93rem">Wait between scans</span>
        <span style="font-family:var(--font-mono);font-size:.9rem;border:1px solid var(--line-strong);
                     border-radius:.6rem;padding:7px 13px;min-height:36px;display:flex;align-items:center">24h</span>
      </div>
    </div>

      </div>

  <div style="margin-top:auto;padding:22px 16px 24px">
    <p style="margin:0;font-size:.8rem;color:var(--ink-faint);line-height:1.55;text-align:center">Points come out of your own goods.</p>
  </div>
</div>
</x-dc>
</body>
</html>
