<title>Treasury Gift Walkthrough</title>
<!-- Kept out of SEARCH by naming the search crawlers, NOT with a blanket robots meta: the blanket
     form addresses every robot, and a link-preview crawler can read it as "do not process this page". -->
<meta name="googlebot" content="noindex,nofollow">
<meta name="bingbot" content="noindex,nofollow">
<meta name="slurp" content="noindex,nofollow">

<style>
  /* Layout: the demo site's stage (shops tokens) around a phone that renders HeartBank Treasury in
     its OWN design — Tailwind's default greys and yellow-500 — with the gift pieces in the shop's. */
  :root{
    --bg:#fcfbfe; --surface:#f4f1fb; --surface-2:#ebe7f5;
    --line:rgba(20,16,30,.12); --line-strong:rgba(20,16,30,.28);
    --ink:#16141c; --ink-dim:#5b5766; --ink-faint:#8b8796;
    --accent:#15803d; --accent-soft:#106430; --accent-ink:#ffffff;
    --accent-wash:rgba(16,100,48,.10); --accent-edge:rgba(16,100,48,.25);
    --stage:#e9e5f0;
    --font-display:"Newsreader",Georgia,serif;
    --font-text:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --font-km:"Noto Sans Khmer","IBM Plex Sans",sans-serif;
    --r-card:1.25rem; --r-control:1rem; --r-pill:999px;
    /* Treasury, as the app ships it */
    --t-sans:"Noto Sans Khmer",ui-sans-serif,system-ui,sans-serif;
    --t-ground:#e5e7eb; --t-card:#ffffff; --t-ink:#111827; --t-dim:#6b7280; --t-faint:#9ca3af;
    --t-line:#e5e7eb; --t-field:#f9fafb; --t-field-line:#d1d5db; --t-chip:#f3f4f6;
    --t-yellow:#eab308; --t-yellow-ink:#ffffff; --t-pill:#fefce8; --t-pill-line:#fde047; --t-pill-ink:#a16207;
    --t-purple:#9333ea; --t-purple-wash:#faf5ff; --t-purple-line:#e9d5ff; --t-fact:#f3f4f6;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0a0a0f; --surface:#17171d; --surface-2:#1f1f27;
    --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.18);
    --ink:#f5f5f7; --ink-dim:#9b9ba5; --ink-faint:#6b6b76;
    --accent:#3fa564; --accent-soft:#96c6a8; --accent-ink:#08130c;
    --accent-wash:rgba(63,165,100,.14); --accent-edge:rgba(63,165,100,.32);
    --stage:#121218;
    --t-ground:#4b5563; --t-card:#1f2937; --t-ink:#f9fafb; --t-dim:#9ca3af; --t-faint:#6b7280;
    --t-line:#374151; --t-field:#374151; --t-field-line:#4b5563; --t-chip:#374151;
    --t-pill:rgba(113,63,18,.25); --t-pill-line:#a16207; --t-pill-ink:#facc15;
    --t-purple-wash:rgba(88,28,135,.3); --t-purple-line:#6b21a8; --t-fact:#374151;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0a0a0f; --surface:#17171d; --surface-2:#1f1f27;
    --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.18);
    --ink:#f5f5f7; --ink-dim:#9b9ba5; --ink-faint:#6b6b76;
    --accent:#3fa564; --accent-soft:#96c6a8; --accent-ink:#08130c;
    --accent-wash:rgba(63,165,100,.14); --accent-edge:rgba(63,165,100,.32);
    --stage:#121218;
    --t-ground:#4b5563; --t-card:#1f2937; --t-ink:#f9fafb; --t-dim:#9ca3af; --t-faint:#6b7280;
    --t-line:#374151; --t-field:#374151; --t-field-line:#4b5563; --t-chip:#374151;
    --t-pill:rgba(113,63,18,.25); --t-pill-line:#a16207; --t-pill-ink:#facc15;
    --t-purple-wash:rgba(88,28,135,.3); --t-purple-line:#6b21a8; --t-fact:#374151;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  /* ⚠️ Not decorative: without it any class that sets display beats the UA's [hidden]. */
  [hidden]{display:none!important}
  body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font-text);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;text-align:inherit}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .km{font-family:var(--font-km)}

  /* ---- the stage ---- */
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;gap:14px}
  .lede{max-width:430px;width:100%;text-align:center}
  .lede h1{font-family:var(--font-display);font-size:1.5rem;font-weight:600;margin:0 0 4px;letter-spacing:-.02em;text-wrap:balance}
  .lede p{margin:0;font-size:.88rem;color:var(--ink-dim);line-height:1.5}
  .roles{display:flex;gap:6px;background:var(--surface);border-radius:var(--r-pill);padding:5px;width:100%;max-width:430px}
  .role{flex:1;min-height:46px;border-radius:var(--r-pill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink-dim);text-align:center}
  .role[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}
  .role b{font-size:.96rem;font-weight:600}
  .role span{font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;font-family:var(--font-mono)}
  .guide{max-width:430px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 15px;font-size:.86rem;line-height:1.5}
  .guide .end{margin:0 0 6px;font-family:var(--font-display);font-size:1.06rem;font-weight:600;letter-spacing:-.01em;color:var(--accent-soft)}
  .guide p{margin:0}
  .guide .gr{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-top:6px}
  .guide .reset{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);flex:none}

  /* ---- the phone ---- */
  .phone{width:100%;max-width:390px;background:var(--t-ground);border-radius:26px;overflow:hidden;border:1px solid var(--line);
         box-shadow:0 18px 50px rgba(20,16,30,.16);display:flex;flex-direction:column;height:min(780px,80vh);color:var(--t-ink);font-family:var(--t-sans);line-height:1.5}
  .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
  @media (max-width:430px){
    .wrap{min-height:100dvh;padding:14px 0 0;gap:10px}
    .lede,.guide{padding-left:16px;padding-right:16px}
    .guide{border-radius:0;border-left:0;border-right:0}
    .roles{width:auto;max-width:none;align-self:stretch;margin:0 12px}
    /* ⛔ No nested scroller on a phone, and no overflow:hidden on .phone: either one leaves a sticky
       bar nothing to stick within. On mobile the DOCUMENT scrolls. */
    .phone{max-width:none;height:auto;flex:none;border-radius:0;overflow:visible;border-left:0;border-right:0;border-bottom:0;box-shadow:none}
    .scroll{overflow:visible;flex:none;overscroll-behavior:auto}
    .foot{position:sticky;bottom:0}
  }

  /* ---- Treasury pieces ---- */
  .thead{background:var(--t-card);border-bottom:1px solid var(--t-line);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex:none}
  .thead .t{display:flex;align-items:center;gap:9px;font-size:1.4rem;font-weight:600}
  .thead sub{font-size:.72rem;color:var(--t-faint);margin-left:3px}
  .tnav{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap;flex:none}
  .tnav button{font-size:.78rem;padding:5px 11px;border-radius:999px;background:var(--t-card);color:var(--t-dim);border:1px solid var(--t-line)}
  .tnav button[aria-current="true"]{background:var(--t-pill);color:var(--t-pill-ink);border-color:var(--t-pill-line);font-weight:600}
  .body{padding:16px 14px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
  .card{background:var(--t-card);border-radius:.5rem;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:20px 18px;display:flex;flex-direction:column;gap:14px}
  .h1{margin:0;font-size:1.2rem;font-weight:700}
  .lbl{display:block;margin:0 0 4px;font-size:.86rem;font-weight:500}
  .inp{width:100%;padding:8px 11px;font:inherit;font-size:1rem;color:var(--t-ink);background:var(--t-field);border:1px solid var(--t-field-line);border-radius:.5rem}
  textarea.inp{resize:none;min-height:74px}
  .xs{font-size:.75rem;color:var(--t-dim);margin:0}
  .sm{font-size:.86rem;margin:0}
  .ybtn{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:10px 14px;font-size:.88rem;font-weight:500;color:var(--t-yellow-ink);background:var(--t-yellow);border-radius:.5rem;text-align:center}
  .pbtn{background:var(--t-purple);font-weight:700}
  .ypill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;font-size:.84rem;font-weight:500;color:var(--t-pill-ink);background:var(--t-pill);border:1px solid var(--t-pill-line);border-radius:.5rem;align-self:flex-start}
  .fact{padding:11px 13px;background:var(--t-fact);border-radius:.5rem;font-size:.86rem}
  .fact .xs{margin-top:3px}
  .hearts{display:flex;gap:9px;justify-content:center;background:var(--t-card);border-radius:.5rem;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:12px 8px}
  .hearts button{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .hearts button[aria-pressed="true"]{box-shadow:0 0 0 1px var(--t-card),0 0 0 2px var(--t-faint)}
  .video{height:200px;width:113px;border-radius:.75rem;overflow:clip;background:#000;margin:0 auto;position:relative}
  .video .tag{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--font-mono);font-size:.55rem;letter-spacing:.04em;color:#fff;opacity:.8}
  .pin{display:flex;justify-content:space-between;gap:12px;padding:7px 11px;background:var(--t-field);border-radius:.5rem;font-size:.86rem}
  .pin span:last-child{font-size:.74rem;color:#ca8a04}
  .row{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--t-line);border-radius:.5rem;background:var(--t-card);width:100%}
  .row .grow{min-width:0;flex:1}
  .toggle{width:44px;height:24px;border-radius:999px;background:var(--t-line);position:relative;flex:none}
  .toggle i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .toggle[aria-checked="true"]{background:var(--t-yellow)}
  .toggle[aria-checked="true"] i{left:auto;right:2px}
  .seg{display:flex;border:1px solid var(--t-field-line);border-radius:.5rem;overflow:clip;font-size:.8rem}
  .seg button{flex:1;padding:8px 6px;text-align:center;background:var(--t-field);color:var(--t-dim);white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--t-purple);color:#fff;font-weight:600}
  .sheet-dim{height:46px;background:rgba(0,0,0,.6);flex:none}
  .sheet{background:var(--t-card);border-radius:1rem 1rem 0 0;margin-top:-14px;flex:1;display:flex;flex-direction:column;position:relative}
  .sheet-h{position:relative;padding:15px 50px 11px 16px;border-bottom:1px solid var(--t-line)}
  .sheet-h .x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t-dim);font-size:1rem}
  .sheet-b{padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
  .short{position:relative;background:#000;border-radius:.75rem;overflow:clip;min-height:470px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
  .short .bgv{position:absolute;inset:0}
  .short .ov{position:relative;padding:14px 14px 18px;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.35) 70%,transparent)}
  .short .rail{position:absolute;right:10px;top:150px;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:.66rem;text-align:center}
  .short .rt{width:50px;height:50px;border-radius:50%;background:rgba(255,215,0,.3);display:flex;align-items:center;justify-content:center}
  .giftrow{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 10px;border-radius:.75rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);width:100%;color:#fff}
  .note-in{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border:1px solid var(--t-line);border-radius:.5rem;background:var(--t-card);width:100%}
  .rules{margin:0;padding:0 2px;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;color:var(--t-dim)}

  /* ---- the shop's pieces (shared.333.eco/web/gift/), in the shop's design ---- */
  .sx{font-family:var(--font-text);color:var(--ink);line-height:1.55}
  .sx .disp{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em}
  .sx .dim{color:var(--ink-dim)} .sx .faint{color:var(--ink-faint)}
  .sx .soft{color:var(--accent-soft);font-weight:500}
  .sx .lbl2{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:0}
  .sx-gift{border:1px solid var(--accent-edge);background:var(--accent-wash);border-radius:var(--r-card);padding:13px 14px}
  .sx-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--bg);width:100%;color:var(--ink)}
  .sx-door{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px dashed var(--accent-edge);border-radius:var(--r-card);background:var(--bg);width:100%;color:var(--ink)}
  .sx-seg{display:flex;gap:8px}
  .sx-seg button{flex:1;border:1px solid var(--line);border-radius:var(--r-control);padding:9px 6px;text-align:center;font-size:.86rem;color:var(--ink-dim);background:var(--bg)}
  .sx-seg button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-wash);color:var(--accent-soft);font-weight:600}
  .sx-go{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:50px;border-radius:var(--r-control);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.96rem;padding:0 18px}
  .step{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:1rem;flex:none}
  .thumb{border-radius:50%;overflow:clip;flex:none;display:block}
  .thumb svg,.face svg{width:100%;height:100%;display:block}
  .face{border-radius:50%;overflow:clip;flex:none;display:block}
  .box{display:flex;align-items:center;justify-content:center}
  .box .thumb{border:2px solid var(--bg);box-shadow:0 3px 9px rgba(20,16,30,.16);position:relative}
  .codecard{border:1px solid var(--line);border-radius:var(--r-card);padding:15px;text-align:center;background:var(--bg)}
  .bqr{width:176px;height:176px;margin:10px auto 4px;background:#fff;padding:8px;border-radius:.6rem}
  .foot{background:var(--t-card);border-top:1px solid var(--t-line);padding:10px 14px 14px;flex:none}
  /* The entry motion starts from a VISIBLE frame: a hidden tab or a thumbnail freezes it there. */
  @media (prefers-reduced-motion:no-preference){.screen-in{animation:in .2s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="lede">
    <h1>A gift with a thank</h1>
    <p>A coffee from a family shop, attached to a thank in HeartBank&reg; Treasury. Switch between the three
       people below. Drawings, not the bank &mdash; nothing here charges anyone.</p>
  </div>
  <div class="roles" role="group" aria-label="Whose phone">
    <button class="role" id="r-bopha" data-role="bopha"><b>Bopha</b><span>the banker</span></button>
    <button class="role" id="r-dara" data-role="dara"><b>Dara</b><span>gives</span></button>
    <button class="role" id="r-sophea" data-role="sophea"><b>Sophea</b><span>receives</span></button>
  </div>
  <div class="guide" id="guide" aria-live="polite"></div>
  <div class="phone"><div class="scroll" id="phone"></div></div>
</div>

<script>
"use strict";

function heart(col, px) { return '<svg viewBox="0 0 24 24" width="' + px + '" height="' + px + '" aria-hidden="true"><path fill="' + col + '" d="M12 21s-7.5-4.6-9.6-9.2C.7 8.1 2.6 4 6.4 4c2.3 0 4 1.3 5.6 3.3C13.6 5.3 15.3 4 17.6 4c3.8 0 5.7 4.1 4 7.8C19.5 16.4 12 21 12 21z"/></svg>'; }
function face(who, px) {

const sq = (id, px) => '<span class="thumb" style="width:' + px + 'px;height:' + px + 'px;border-radius:.8rem"><svg viewBox="0 0 48 48" aria-hidden="true">' + ITEMS[id].art + '</svg></span>';
const thumb = (id, px) => '<span class="thumb" style="width:' + px + 'px;height:' + px + 'px"><svg viewBox="0 0 48 48" aria-hidden="true">' + ITEMS[id].art + '</svg></span>';
function units(lines) { return Object.values(lines).reduce((a, b) => a + b, 0); }
function flat(lines) { const out = []; Object.keys(lines).forEach((id) => { for (let i = 0; i < lines[id]; i++) out.push(id); }); return out; }
function box(lines, px) {
  return '<span class="box">' + flat(lines).slice(0, 3).map((id, n) =>
    '<span class="thumb" style="width:' + px + 'px;height:' + px + 'px;' + (n ? 'margin-left:-' + Math.round(px * .32) + 'px;' : '') + 'z-index:' + (10 - n) + '"><svg viewBox="0 0 48 48" aria-hidden="true">' + ITEMS[id].art + '</svg></span>').join("") + '</span>';
}
function what(lines) {
  const ids = Object.keys(lines).filter((id) => lines[id] > 0);
  return ids.map((id) => ITEMS[id].en + (lines[id] > 1 ? " ×" + lines[id] : "")).join(" · ");
}
const price = (shop, lines) => Object.keys(lines).reduce((s, id) => s + ITEMS[id].price * lines[id], 0);
const byShopThenItem = (a, b) => (SHOPS[a.shop].name + what(a.lines)).localeCompare(SHOPS[b.shop].name + what(b.lines));

    foundation: {bopha: 6000, dara: 0, sophea: 0},           // Re-Thank Foundation
    thanks: [], gifts: {}, retips: [], atm: {bopha:[], dara:[], sophea:[]}, notes: {bopha:[], dara:[], sophea:[]},
    seq: 0, ending: "", opened: false, thankedBack: false
  };
  U = {bopha:{view:"family"}, dara:{view:"compose", c:compose("dara", "sophea")}, sophea:{view:"inbox"}};
}
function compose(from, to, extra) {
  return Object.assign({from, to, heart:2, note: from === "dara" ? "Thank you for staying late to help me move the shelves." : "",
                        tip:"", donation:"", mode:"tip", gift:null, giftThank:null, err:""}, extra || {});
}
const id = (p) => p + (++S.seq);
const u = () => U[S.role];
function heldBy(who) { return Object.values(S.gifts).filter((g) => g.kind === "b-regift" && g.holder === who && g.state === "open").sort(byShopThenItem); }
function shopsOn() { return Object.keys(S.on).filter((k) => S.on[k]).sort((a, b) => SHOPS[a].name.localeCompare(SHOPS[b].name)); }
function doorOpen(who) { return heldBy(who).length > 0 || shopsOn().length > 0; }
function note(who, n) { if (who !== undefined) S.notes[who].unshift(n); }

V.gift = function () {

V.retip = function () {
  const t = S.thanks.find((x) => x.id === u().cur), r = u().rt, me = S.role;
  const done = new Set(S.retips.filter((x) => x.parent === t.id && x.from === me).map((x) => x.to));
  const left = [t.from, t.to].filter((p) => p !== me && !done.has(p));
  const total = (t.tip || 0) + S.retips.filter((x) => x.parent === t.id && x.kind === "money").reduce((a, x) => a + x.amt, 0);
  const flows = [];
  if (t.tip) flows.push([t.from, t.to, "Tip", riel(t.tip)]);
  S.retips.filter((x) => x.parent === t.id).forEach((x) => flows.push([x.from, x.to, "Re-Thank", x.kind === "money" ? riel(x.amt) : "🎁 " + what(S.gifts[x.gift].lines)]));
  const flowRows = flows.map((f) => '<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--t-line)">' + face(f[0], 26) + '<span class="xs">@' + f[0] + '</span><span style="color:var(--t-faint)">→</span>' + face(f[1], 26) + '<span class="xs">@' + f[1] + '</span>' +
    '<span style="margin-left:auto;text-align:right"><span class="xs" style="display:block;font-size:.6rem">' + f[2] + '</span><b style="font-size:.86rem">' + esc(f[3]) + '</b></span></div>').join("");
  const role = (p) => p === t.from ? "Sender" : "Recipient";
  let body = (flowRows || '<p class="xs" style="text-align:center">Be the first to re-thank!</p>') +
    '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:.5rem;background:var(--t-purple-wash);border:1px solid var(--t-purple-line)">' + face(me, 26) + '<span><span class="sm" style="display:block">Re-thanking as <b style="font-weight:900">@' + me + '</b></span><span class="xs">Kampuchea</span></span></div>';
  if (!left.length) {
    body += '<p class="sm" style="text-align:center;color:var(--t-dim);padding:14px 0">You have re-thanked everyone</p>';
  } else {
    body += '<span class="ypill">📍 Phnom Penh</span>' +
      '<div class="seg" role="group" aria-label="Re-thank with"><button data-a="rt-mode" data-x="money" aria-pressed="' + (r.mode === "money") + '">🫶 Re-Thank with Money</button><button data-a="rt-mode" data-x="gift" aria-pressed="' + (r.mode === "gift") + '">🎁 Re-Thank with a Gift</button></div>';
    if (r.mode === "money") {
      body += '<p class="xs">Your Re-Thank Foundation Balance: ' + riel(S.foundation[me]) + ' · then your B-Account</p>' +
        '<div style="display:flex;align-items:center;gap:8px"><input class="inp mono" id="rtamt" inputmode="numeric" placeholder="Enter a re-thank amount" data-in="rtamt" value="' + esc(r.amt) + '"><span class="sm" style="color:var(--t-dim)">KHR</span></div>';
      const a = parseInt(r.amt, 10);
      if (a > 0) {
        body += left.map((p) => '<button class="ybtn" data-a="rt-send" data-x="' + p + '">Re-Thank ' + role(p) + ' <b style="font-weight:900">@' + p + '</b> — <b style="font-weight:900">' + riel(a) + '</b></button>').join("") +
          (left.length > 1 ? '<button class="ybtn pbtn" data-a="rt-all">Re-Thank All (' + left.length + ') — ' + riel(a * left.length) + ' total</button>' : '');
      }
    } else {
      const d = draftView(r.gift);
      if (d) {
        body += giftBlock(d, "Only the person you give it to sees the code.", "rt-remove") +
          (d.held ? '<p class="xs">Already paid for. Sending it moves nothing from your account.</p>' : '<p class="xs" style="color:var(--t-ink)">Paid from your Personal Account when you send: <b>' + riel(price(d.shop, d.lines)) + '</b>. Only you see this figure.</p>') +
          left.map((p) => '<button class="ybtn" data-a="rt-gift" data-x="' + p + '">Re-Thank ' + role(p) + ' <b style="font-weight:900">@' + p + '</b> — 🎁</button>').join("");
      } else if (doorOpen(me)) {
        body += door("A coffee instead of money — for one person here", "rt-door");
      } else {
        body += '<p class="xs">Gift codes come from shops your family banker switches on.</p>';
      }
    }
    if (r.err) body += '<div class="fact">' + r.err + '</div>';
  }
  const title = '<p style="margin:0;display:flex;align-items:baseline;gap:8px"><span style="font-size:1.7rem;font-weight:900">🐷 ' + riel(total) + '</span><span style="font-size:1rem;font-weight:600;color:var(--t-faint)">Total</span></p>';
  return sheet(title, body);
};

/* ------------------------------------------------------------------ actions */
const A = {};
function go(view, extra) { Object.assign(u(), {view, flash: ""}, extra || {}); render(true); }
A.tab = (k) => { if (k === "members") u().pass = null; go(k); };
A.back = () => { const home = S.role === "bopha" ? "family" : "inbox"; go(home); };
A.close = () => {
  const x = u();
  if (x.view === "menu" || x.view === "door") return go(x.pick.ctx === "compose" ? "compose" : "retip");
  if ((x.view === "retip" || x.view === "gift") && S.thanks.some((t) => t.id === x.cur)) return go("short");
  go("inbox");
};
A["switch"] = (k) => { S.on[k] = !S.on[k]; render(); };
A.heart = (i) => { u().c.heart = +i; render(); };
A["open-door"] = () => openDoor("compose");
A["rt-door"] = () => openDoor("retip");
function openDoor(ctx) {
  const held = heldBy(S.role), on = shopsOn();
  if (!held.length && on.length === 1) return go("menu", {pick: {ctx, shop: on[0], lines: {}, keep: "have"}});
  go("door", {pick: {ctx, lines: {}, keep: "have"}});
}
A["pick-shop"] = (k) => { u().pick.shop = k; u().pick.lines = {}; go("menu"); };
A.qty = (idd, dy) => { const l = u().pick.lines, n = (l[idd] || 0) + (+dy); if (n <= 0) delete l[idd]; else if (units(l) < 31 || +dy < 0) l[idd] = n; render(); };
A.keep = (k) => { u().pick.keep = k; render(); };
A.attach = () => {
  const p = u().pick, g = {src: "buy", shop: p.shop, lines: Object.assign({}, p.lines), keep: p.keep};
  if (p.ctx === "compose") { u().c.gift = g; u().c.tip = ""; u().c.err = ""; go("compose"); }
  else { u().rt.gift = g; u().rt.err = ""; go("retip"); }
};
A["use-held"] = (gid) => {
  const p = u().pick, g = {src: "held", giftId: gid};
  if (p.ctx === "compose") { u().c.gift = g; u().c.tip = ""; u().c.err = ""; go("compose"); }
  else { u().rt.gift = g; u().rt.err = ""; go("retip"); }
};
A["remove-gift"] = () => { u().c.gift = null; u().c.err = ""; render(); };
A["rt-remove"] = () => { u().rt.gift = null; u().rt.err = ""; render(); };

// Place a gift for `holder`, paid by `from` (or pass a held one). Returns the gift id, or a refusal sentence.
function placeGift(from, holder, d) {
  if (d.src === "held") {
    const g = S.gifts[d.giftId];
    if (!g || g.state !== "open") return {err: "That one has already gone."};
    g.state = "passed";
    const nid = id("g");
    S.gifts[nid] = {id: nid, kind: "b-gift", shop: g.shop, lines: g.lines, payer: g.payer, via: from, holder, state: "open"};
    return {gift: nid};
  }
  const total = price(d.shop, d.lines);
  if (S.account[from] < total) return {err: "Your Personal Account has " + riel(S.account[from]) + " — this gift is " + riel(total) + "."};
  S.account[from] -= total;
  S.atm[from].unshift({what: "Payment · " + SHOPS[d.shop].host, amt: -total});
  const nid = id("g");
  S.gifts[nid] = {id: nid, kind: d.keep === "pass" ? "b-regift" : "b-gift", shop: d.shop, lines: d.lines, payer: from, via: null, holder, state: "open"};
  return {gift: nid};
}

A.send = () => {
  const c = u().c, from = c.from, to = c.to;
  c.err = "";
  const tip = parseInt(c.tip, 10) || 0, don = parseInt(c.donation, 10) || 0;
  if (c.mode !== "donate" && tip > 0 && c.gift) { c.err = "One kind of value per thank."; return render(); }   // unreachable by design; the server refuses it too
  if (tip > S.account[from] || don > S.account[from]) { c.err = "Your Personal Account has " + riel(S.account[from]) + "."; return render(); }
  let gid = null;
  if (c.gift) { const r = placeGift(from, to, c.gift); if (r.err) { c.err = r.err; return render(); } gid = r.gift; }
  if (tip) { S.account[from] -= tip; S.account[to] += tip; S.atm[from].unshift({what: "Tip · @" + to, amt: -tip}); S.atm[to].unshift({what: "Tip · @" + from, amt: tip}); }
  if (don) { S.account[from] -= don; S.foundation[to] += don; S.atm[from].unshift({what: "Donation · @" + to + "’s Re-Thank Foundation", amt: -don}); }
  const t = {id: id("t"), from, to, note: c.note, heart: c.heart, tip, gift: gid, backFor: c.giftThank};
  S.thanks.unshift(t);
  const g = gid ? S.gifts[gid] : null;
  note(to, {title: "Token of Appreciation", text: nm(from) + " thanked You" + (g ? " · with a gift from " + SHOPS[g.shop].name : ""), thank: t.id});
  MEMBERS.filter((m) => m !== from && m !== to).forEach((m) => note(m, {title: "About Your Family", text: nm(from) + " thanked " + nm(to), thank: t.id}));
  if (c.giftThank) S.thankedBack = true;
  if (c.gift && c.gift.src === "held") S.ending = "Sophea passed it on. A gift held to give becomes someone’s the moment it is given.";
  else if (c.giftThank) S.ending = "A coffee, not an amount — and the thanks came back with no price on it.";
  U[from].c = compose(from, from === "dara" ? "sophea" : MEMBERS.find((m) => m !== from));
  go("short", {cur: t.id, flash: "Sent."});
};

A.note = (i) => {
  const n = S.notes[S.role][+i];
  go("short", {cur: n.thank, flash: ""});
};
A["open-gift"] = (gid) => {
  const g = S.gifts[gid];
  const first = !g.looked; g.looked = true;
  if (S.role === "sophea") S.opened = true;
  go("gift", {gift: gid, firstLook: first});
};
A["thank-back"] = (p) => { U[S.role].c = compose(S.role, p, {mode: "donate", giftThank: u().gift}); go("compose"); };
A["give-it"] = () => { go("members", {pass: u().gift}); };
A["pick-member"] = (m) => {
  const x = u();
  x.c = compose(S.role, m, x.pass ? {gift: {src: "held", giftId: x.pass}} : {});
  x.pass = null;
  go("compose");
};
A.retip = () => go("retip", {rt: {mode: "money", amt: "", gift: null, err: ""}});
A["rt-mode"] = (k) => { u().rt.mode = k; u().rt.err = ""; render(); };
function retipMoney(to, amt) {
  const me = S.role, t = S.thanks.find((x) => x.id === u().cur);
  const fromFund = Math.min(S.foundation[me], amt), fromAcct = amt - fromFund;
  if (fromAcct > S.account[me]) return "Need " + riel(fromAcct - S.account[me]) + " more — B-Account empty";
  S.foundation[me] -= fromFund; S.account[me] -= fromAcct; S.account[to] += amt;
  S.atm[me].unshift({what: "Re-Thank · @" + to, amt: -amt}); S.atm[to].unshift({what: "Re-Thank · @" + me, amt: amt});
  S.retips.push({parent: t.id, from: me, to, kind: "money", amt});
  note(to, {title: "Re-Thank", text: nm(me) + " re-thanked You", thank: t.id});
  return "";
}
A["rt-send"] = (p) => { const r = u().rt; r.err = retipMoney(p, parseInt(r.amt, 10)); render(); };
A["rt-all"] = () => {
  const r = u().rt, t = S.thanks.find((x) => x.id === u().cur), me = S.role, a = parseInt(r.amt, 10);
  const done = new Set(S.retips.filter((x) => x.parent === t.id && x.from === me).map((x) => x.to));
  for (const p of [t.from, t.to].filter((q) => q !== me && !done.has(q))) { r.err = retipMoney(p, a); if (r.err) break; }
  render();
};
A["rt-gift"] = (p) => {
  const r = u().rt, t = S.thanks.find((x) => x.id === u().cur), me = S.role;
  const res = placeGift(me, p, r.gift);
  if (res.err) { r.err = res.err; return render(); }
  S.retips.push({parent: t.id, from: me, to: p, kind: "gift", gift: res.gift});
  const g = S.gifts[res.gift];
  note(p, {title: "Re-Thank", text: nm(me) + " re-thanked You with a gift from " + SHOPS[g.shop].name, thank: t.id, gift: res.gift});
  r.gift = null; r.mode = "money";
  S.ending = "One send per person: a re-thank with money or with a gift, never both.";
  render();
};
// A gift that came with a re-thank opens from its notification.
const _note = A.note;
A.note = (i) => { const n = S.notes[S.role][+i]; if (n.gift && S.gifts[n.gift].holder === S.role && S.gifts[n.gift].state === "open") { u().cur = n.thank; return A["open-gift"](n.gift); } _note(i); };
A.reset = () => { fresh(); render(true); };

/* ------------------------------------------------------------------ guide */
function guide() {
  const gave = S.thanks.some((t) => t.gift && t.from === "dara");
  let next;
  if (!shopsOn().length) next = "Start as <b>Bopha</b>, the family’s banker. Switch Home Coffee on for #kampuchea — check who it is paid to first.";
  else if (!gave) next = "Now be <b>Dara</b>. Thank Sophea with a gift code instead of a tip: tap <i>Or give a gift code</i>.";
  else if (!S.opened) next = "Now be <b>Sophea</b>. Open the thank from Dara in Notifications and tap the gift.";
  else if (!S.thankedBack) next = "Sophea can thank Dara back from the gift: words, and a donation if she likes. Never a tip.";
  else next = "More to try: as Bopha, open the short and re-thank each person once — with money or with a gift. Or give Sophea a gift <i>to give</i>, and pass it on.";
  return (S.ending ? '<p class="end">' + S.ending + '</p>' : '') + '<div class="gr"><p>' + next + '</p><button class="reset" data-a="reset">Start over</button></div>';
}

/* ------------------------------------------------------------------ render */
function render(top) {
  const x = u();
  const isSheet = ["door", "menu", "gift", "retip"].includes(x.view);
  const ph = document.getElementById("phone");
  ph.innerHTML = header(x.view !== "family" && x.view !== "inbox") + (isSheet ? "" : nav()) + V[x.view]();
  ["bopha", "dara", "sophea"].forEach((r) => document.getElementById("r-" + r).setAttribute("aria-pressed", S.role === r));
  document.getElementById("guide").innerHTML = guide();
  if (top) { ph.scrollTop = 0; if (window.innerWidth <= 430) { const y = ph.getBoundingClientRect().top + window.scrollY - 8; if (window.scrollY > y) window.scrollTo(0, y); } }
}

document.addEventListener("click", (e) => {
  const r = e.target.closest("[data-role]");
  if (r) { S.role = r.dataset.role; render(true); return; }
  const b = e.target.closest("[data-a]");
  if (!b || b.disabled) return;
  const f = A[b.dataset.a];
  if (f) f(b.dataset.x, b.dataset.y);
});
document.addEventListener("input", (e) => {
  const k = e.target.dataset && e.target.dataset.in;
  if (!k) return;
  const x = u();
  if (k === "rtamt") { x.rt.amt = e.target.value.replace(/[^0-9]/g, ""); const pos = e.target.selectionStart; render(); const el = document.getElementById("rtamt"); if (el) { el.focus(); el.setSelectionRange(pos, pos); } return; }
  x.c[k] = k === "note" ? e.target.value : e.target.value.replace(/[^0-9]/g, "");
});

fresh();
render(true);
</script>
